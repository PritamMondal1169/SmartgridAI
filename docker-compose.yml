version: '3.8'

services:
  smartgridai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartgridai-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET=smartgrid-secret-key-production-2026
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

